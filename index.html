<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Sweet-T</title>
  <script>
    // No-FOUC theme bootstrap — apply the saved theme before first paint.
    try {
      var t = localStorage.getItem("sweet_t_theme");
      if (["dark", "light", "ocean", "sunset", "midnight"].indexOf(t) >= 0) {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="bar">
    <h1 class="brand"><img src="icons/icon-192.png" alt="" class="brand-mark" /><span>Sweet-T</span></h1>
    <span id="last-reading" class="muted small"></span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button id="tab-log" type="button" class="tab is-active" role="tab" aria-selected="true" aria-controls="log-view" data-tab="log">Log</button>
    <button id="tab-metrics" type="button" class="tab" role="tab" aria-selected="false" aria-controls="metrics-view" data-tab="metrics">Metrics</button>
  </nav>

  <main>
    <div id="log-view" class="tab-panel" role="tabpanel" aria-labelledby="tab-log">
    <section class="card calc">
      <label for="glucose">Glucose <span class="muted">(mmol/L)</span></label>
      <div class="input-row">
        <input id="glucose" type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 7.2" autofocus />
        <button id="calc" type="button">Calculate</button>
      </div>

      <div id="result" class="result hidden" aria-live="polite">
        <div class="result-units"><span id="result-units">0.0</span><span class="muted small">u</span></div>
        <div id="result-formula" class="muted small"></div>
        <div id="carb-advice" class="carb-advice hidden" role="alert" aria-live="assertive"></div>
        <div class="dose-row">
          <div class="dose-field">
            <label for="humalog">Humalog taken</label>
            <input id="humalog" type="text" inputmode="none" readonly step="1" min="0" placeholder="u" />
          </div>
          <div class="dose-field">
            <label for="lantus">Lantus taken</label>
            <input id="lantus" type="text" inputmode="none" readonly step="1" min="0" placeholder="u" />
          </div>
          <div class="dose-field">
            <label for="carbs">Carbs (g)</label>
            <input id="carbs" name="carbs_g" type="text" inputmode="none" readonly step="1" min="0" placeholder="(optional)" />
          </div>
        </div>
        <button id="no-insulin" type="button" class="ghost no-insulin">No insulin taken</button>
        <div class="result-actions">
          <input id="note" type="text" placeholder="Note (optional)" />
          <label class="checkbox-label">
            <input id="timestamp-toggle" type="checkbox" />
            <span>Custom time</span>
          </label>
          <input id="timestamp-input" type="datetime-local" hidden />
          <button id="save" type="button" class="primary">Save reading</button>
          <button id="discard" type="button" class="ghost">Discard</button>
        </div>
      </div>

      <button id="insulin-only-toggle" type="button" class="ghost insulin-only-toggle">+ Log insulin only</button>
      <div id="insulin-only" class="insulin-only hidden">
        <div class="dose-row">
          <div class="dose-field">
            <label for="io-humalog">Humalog</label>
            <input id="io-humalog" type="text" inputmode="none" readonly step="1" min="0" placeholder="u" />
          </div>
          <div class="dose-field">
            <label for="io-lantus">Lantus</label>
            <input id="io-lantus" type="text" inputmode="none" readonly step="1" min="0" placeholder="u" />
          </div>
          <div class="dose-field">
            <label for="io-carbs">Carbs (g)</label>
            <input id="io-carbs" name="carbs_g" type="text" inputmode="none" readonly step="1" min="0" placeholder="(optional)" />
          </div>
        </div>
        <input id="io-note" type="text" placeholder="Note (optional)" />
        <label class="checkbox-label">
          <input id="io-timestamp-toggle" type="checkbox" />
          <span>Custom time</span>
        </label>
        <input id="io-timestamp-input" type="datetime-local" hidden />
        <div class="io-actions">
          <button id="io-save" type="button" class="primary">Save insulin</button>
          <button id="io-cancel" type="button" class="ghost">Cancel</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>Glucose trend</h2>
        <div class="row">
          <span id="chart-summary" class="muted small"></span>
          <select id="chart-range" class="chart-range" aria-label="Chart range">
            <option value="week" selected>Week</option>
            <option value="month">Month</option>
            <option value="quarter">Quarter</option>
            <option value="year">Year</option>
            <option value="all">All</option>
          </select>
        </div>
      </div>
      <div class="chart-mode-row">
        <div class="chart-mode" role="group" aria-label="Chart series">
          <button type="button" data-mode="both" class="is-active">Both</button>
          <button type="button" data-mode="glucose">Glucose</button>
          <button type="button" data-mode="insulin">Insulin</button>
        </div>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card actions-card">
      <button id="export" type="button" class="ghost">Export CSV</button>
      <button id="import" type="button" class="ghost">Import CSV</button>
      <input id="import-input" type="file" accept=".csv" hidden />
      <button id="weekly-review" type="button" class="ghost">Weekly review</button>
      <button id="settings-open" type="button" class="ghost">Settings</button>
      <button id="clear-all" type="button" class="ghost danger">Clear all</button>
    </section>

    <section class="card">
      <div class="row between">
        <h2>History</h2>
        <span id="history-count" class="muted small"></span>
      </div>
      <ul id="history" class="history"></ul>
      <button id="history-more" type="button" class="ghost history-more hidden"></button>
      <p id="history-empty" class="muted small empty">No readings yet.</p>
    </section>
    </div>

    <div id="metrics-view" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-metrics" aria-label="Metrics">
      <p id="metrics-empty" class="muted small empty hidden">No readings yet.</p>
    </div>
  </main>

  <div id="import-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Import CSV</h2>
      <p class="muted small">Preview first 5 rows:</p>
      <div id="import-preview" class="import-preview"></div>
      <div class="modal-actions">
        <button id="import-confirm" type="button" class="primary">Confirm Import</button>
        <button id="import-cancel" type="button" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="settings-overlay" class="settings-overlay hidden" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="settings-drawer">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" type="button" class="ghost" aria-label="Close">×</button>
      </div>

      <section class="settings-section">
        <h3>Cloud Sync</h3>

        <div class="settings-row">
          <label for="sync-enabled" class="settings-label">Sync enabled</label>
          <label class="toggle">
            <input id="sync-enabled" type="checkbox" />
            <span class="toggle-track"></span>
          </label>
        </div>
        <p id="sync-toggle-error" class="settings-error hidden">URL and token are required to enable sync.</p>

        <div class="settings-field">
          <label for="sync-url">API base URL</label>
          <input id="sync-url" type="text" placeholder="https://watch.example.com" autocomplete="off" spellcheck="false" />
        </div>

        <div class="settings-field">
          <label for="sync-token">API token</label>
          <input id="sync-token" type="password" placeholder="Bearer token" autocomplete="off" />
        </div>

        <p id="sync-pending" class="muted small settings-pending"></p>
      </section>

      <section class="settings-section">
        <h3>Appearance</h3>
        <div class="settings-field">
          <label for="theme-select">Theme</label>
          <select id="theme-select" class="settings-select" aria-label="Theme"></select>
        </div>
      </section>

      <section class="settings-section">
        <h3>Google Drive Backup</h3>
        <div class="settings-row">
          <span class="settings-label">Status</span>
          <span id="gdrive-status" class="muted small">Not connected</span>
        </div>
        <div class="settings-field">
          <label for="gdrive-client-id">OAuth Client ID</label>
          <input id="gdrive-client-id" type="text" placeholder="…apps.googleusercontent.com" autocomplete="off" spellcheck="false" />
        </div>
        <div class="settings-inline-actions">
          <button id="gdrive-connect" type="button" class="primary">Connect</button>
          <button id="gdrive-backup" type="button" class="ghost">Back up now</button>
          <button id="gdrive-restore" type="button" class="ghost">Restore</button>
        </div>
        <p id="gdrive-info" class="muted small settings-status"></p>
      </section>

      <div class="settings-actions">
        <button id="settings-save" type="button" class="primary">Save</button>
        <button id="settings-cancel" type="button" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
